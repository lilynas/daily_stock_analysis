# ===================================
# A股自选股智能分析系统 - Docker Compose (GHCR镜像版)
# ===================================
#
# 使用预构建的 GHCR 镜像，无需本地构建
#
# 使用方式:
#   1. 先确保已配置 .env 文件
#   2. 启动定时模式: docker-compose -f ./docker/docker-compose.ghcr.yml up -d analyzer
#   3. 启动 Web 模式: docker-compose -f ./docker/docker-compose.ghcr.yml up -d server
#   4. 同时启动两种模式: docker-compose -f ./docker/docker-compose.ghcr.yml up -d
#
# 注意: 首次运行会自动拉取镜像

version: '3.8'

# 公共配置
x-common: &common
  restart: unless-stopped

  # 环境变量（从 .env 文件加载）
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../.env:/app/.env

  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

  # 资源限制
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

services:
  # 定时任务模式 - 使用 scheduler 镜像
  analyzer:
    <<: *common
    container_name: stock-analyzer
    image: ghcr.io/lilynas/daily_stock_analysis-scheduler:latest
    # 如果需要指定特定版本，修改 tag，如 :v1.0.0
    # image: ghcr.io/lilynas/daily_stock_analysis-scheduler:v1.0.0
    pull_policy: always

  # Web 模式 - 使用 web 镜像
  server:
    <<: *common
    container_name: stock-server
    image: ghcr.io/lilynas/daily_stock_analysis-web:latest
    # 如果需要指定特定版本，修改 tag，如 :v1.0.0
    # image: ghcr.io/lilynas/daily_stock_analysis-web:v1.0.0
    pull_policy: always
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
